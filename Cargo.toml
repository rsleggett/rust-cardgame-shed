[package]
name = "shed"
version = "0.1.0"
edition = "2021"

[dependencies]
# `wav` is added on top of the defaults (which already include `vorbis` for the
# OGG music) so the Kenney CC0 sound effects — distributed as WAV — decode.
bevy = { version = "0.14.2", features = ["wav"] }
rand = "0.8.5"

# On wasm32, rand's entropy source (getrandom) needs the `js` feature or
# `rand::random()` panics at runtime ("the operation is not supported").
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Bevy wasm bundles are large; trade compile time for a smaller download.
[profile.release]
opt-level = "s"
lto = "thin"
