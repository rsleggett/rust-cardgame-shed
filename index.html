<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shed</title>

    <!-- Build the `shed` binary to wasm and copy the asset folder into dist/. -->
    <link data-trunk rel="rust" data-bin="shed" data-wasm-opt="s" />
    <link data-trunk rel="copy-dir" href="assets" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a2e1a;
        overflow: hidden;
      }
      /* Bevy binds to this canvas (see Window.canvas in src/main.rs). */
      #bevy-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #cfe8cf;
        font-family: system-ui, sans-serif;
        font-size: 1.25rem;
        letter-spacing: 0.05em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading Shed…</div>
    <canvas id="bevy-canvas"></canvas>
    <script>
      // Hide the loading text once the canvas has been sized by Bevy.
      const canvas = document.getElementById("bevy-canvas");
      const loading = document.getElementById("loading");
      new ResizeObserver(() => {
        if (canvas.width > 1 && canvas.height > 1) {
          loading.remove();
        }
      }).observe(canvas);
    </script>
  </body>
</html>
